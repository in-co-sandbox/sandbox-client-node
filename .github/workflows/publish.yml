name: Publish to npm

# Releasing a package = bumping its `version` and merging to main.
# - Packages marked "private": true (everything under tooling/) are never published.
# - pnpm skips a package whose version is already on npm, so unchanged packages stay as they are.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance: links each published version to this workflow run.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish bumped packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Publish
        run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
